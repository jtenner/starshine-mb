name: "Node Package and Packed Consumers"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/spec/**"
      - "node/**"
      - "tests/node/**"
      - "src/ffi_bridge/**"
      - "ffi/**"
      - "src/cmd/**"
      - "src/cli/**"
      - "src/ir/**"
      - "src/lib/**"
      - "src/passes/**"
      - "src/wast/**"
      - "src/wat/**"
      - "src/binary/**"
      - "src/validate/**"
      - "scripts/**"
      - "package.json"
      - "LICENSE"
      - "NOTICE"
      - "licenses/**"
      - "moon.mod"
      - ".moonignore"
      - "README.md"
      - "README.mooncakes.md"
      - "**/moon.pkg"
      - "moon.mod.json"
      - "moon.pkg.json"
      - ".github/workflows/node-wasm-tests.yml"
      - ".github/actions/setup-moonbit/**"
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/spec/**"
      - "node/**"
      - "tests/node/**"
      - "src/ffi_bridge/**"
      - "ffi/**"
      - "src/cmd/**"
      - "src/cli/**"
      - "src/ir/**"
      - "src/lib/**"
      - "src/passes/**"
      - "src/wast/**"
      - "src/wat/**"
      - "src/binary/**"
      - "src/validate/**"
      - "scripts/**"
      - "package.json"
      - "LICENSE"
      - "NOTICE"
      - "licenses/**"
      - "moon.mod"
      - ".moonignore"
      - "README.md"
      - "README.mooncakes.md"
      - "**/moon.pkg"
      - "moon.mod.json"
      - "moon.pkg.json"
      - ".github/workflows/node-wasm-tests.yml"
      - ".github/actions/setup-moonbit/**"

jobs:
  node-api-surface-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Set up independent Wasm validator and TypeScript
        run: |
          cargo install wasm-tools --version 1.251.0 --locked
          npm install --prefix /tmp/starshine-typescript --no-audit --no-fund typescript@5.8.3
          echo "TSC_BIN=/tmp/starshine-typescript/node_modules/.bin/tsc" >> "$GITHUB_ENV"

      - name: Build, self-optimize and test the exact npm tarball
        run: |
          moon version --all
          moon update
          bun test ./scripts/lib/ffi-generation.test.ts ./scripts/lib/node-generation.test.ts ./scripts/lib/npm-process.test.ts ./scripts/lib/npm-preset.test.ts ./scripts/lib/npm-consumer-scratch.test.ts ./scripts/lib/product-version.test.ts ./scripts/lib/component-task.test.ts
          bun scripts/test/node-package-static-contract.ts
          bun scripts/test/npm-packed-consumers.mjs
          node --test node/test/*.test.mjs
          npm run check-generated --prefix node
          git diff --exit-code -- ffi node src/ffi_bridge/pkg.generated.mbti

      - name: Check the exact Mooncakes source archive and external consumer
        run: |
          mkdir -p dist/mooncakes
          python3 scripts/test/moon-package-contract.test.py
          python3 scripts/test/moon-packed-consumer.py > dist/mooncakes/consumer-report.json
          python3 scripts/test/moon-readme-consumer.py > dist/mooncakes/readme-report.json

      - name: Preserve package validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-evidence
          path: |
            dist/npm/build-report.json
            dist/npm/consumer-report.json
            dist/npm/*.tgz
            dist/npm/*.log
            dist/mooncakes/consumer-report.json
            dist/mooncakes/readme-report.json
            _build/publish/*.zip
