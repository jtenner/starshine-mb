name: "Node API Surface Tests"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "node/**"
      - "tests/node/**"
      - "src/cmd/**"
      - "src/cli/**"
      - "src/ir/**"
      - "src/lib/**"
      - "src/passes/**"
      - "src/wast/**"
      - "src/wat/**"
      - "src/binary/**"
      - "src/validate/**"
      - "scripts/**"
      - "package.json"
      - "moon.mod.json"
      - "moon.pkg.json"
      - ".github/workflows/node-wasm-tests.yml"
  push:
    branches:
      - master
    paths:
      - "node/**"
      - "tests/node/**"
      - "src/cmd/**"
      - "src/cli/**"
      - "src/ir/**"
      - "src/lib/**"
      - "src/passes/**"
      - "src/wast/**"
      - "src/wat/**"
      - "src/binary/**"
      - "src/validate/**"
      - "scripts/**"
      - "package.json"
      - "moon.mod.json"
      - "moon.pkg.json"
      - ".github/workflows/node-wasm-tests.yml"

jobs:
  node-api-surface-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Set up Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify clean-checkout Node package contract
        run: |
          bun scripts/test/node-package-static-contract.ts
          find node -type f -name '*.js' -print0 | xargs -0 -n1 node --check
