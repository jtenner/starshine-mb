name: Set up qualified MoonBit
description: Install and verify the MoonBit snapshot qualified for Starshine.
runs:
  using: composite
  steps:
    - name: Install the qualified MoonBit snapshot
      shell: bash
      env:
        MOONBIT_VERSION: "0.10.17+d971670cd"
      run: |
        set -euo pipefail
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
        bash "$RUNNER_TEMP/install-moonbit.sh" "$MOONBIT_VERSION"
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
        versions="$("$HOME/.moon/bin/moon" version --all)"
        printf '%s\n' "$versions"
        [[ "$versions" == *"moon 0.1.20261023 (3778465 2026-10-23)"* ]]
        [[ "$versions" == *"moonc v0.10.17+d971670cd (2026-10-23)"* ]]
        core_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$HOME/.moon/lib/core/moon.mod")"
        printf 'MoonBit Core %s\n' "$core_version"
        test "$core_version" = "$MOONBIT_VERSION"
